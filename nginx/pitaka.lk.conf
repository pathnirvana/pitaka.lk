# Optimized Hash Size for large mapping (approx 4600 entries)
# Please update /etc/nginx/nginx.conf with these values
# map_hash_max_size 8192;
# map_hash_bucket_size 128;

# Load the NodeID -> KeyID mapping generated by generate_redirects.js
map $node_id_to_map $key_id_result {
    default "";
    include /etc/nginx/conf.d/nodeid_mapping.map;
}

server {
    server_name pitaka.lk *.pitaka.lk;

    index  index.html index.htm;

    # static content served by nginx
    location /main {
        error_page 418 = @querystatic;
        
        # [NEW] Check for NodeID in query params (e.g., ?n=123)
        # If n=123 matches an entry in our map, redirect to KeyID URL
        set $node_id_to_map $arg_n;
        if ($key_id_result) {
            return 301 https://open.tipitaka.lk/sin_apz/$key_id_result;
        }

        if ( $args ~ "n=\d+" ) { return 418; }
        root /home/janaka/www/pitaka.lk;
    }

    # handle server side rendered pages
    location @querystatic {
        proxy_pass http://localhost:3080;
    }

    # rewrite old urls
    location / {
        # [NEW] Check for NodeID in URL path (e.g., /123)
        # Extract the number and check map. Maximize priority over old rewrites.
        if ($uri ~ "^/([0-9]+)") {
            set $node_id_to_map $1;
        }
        if ($key_id_result) {
            return 301 https://open.tipitaka.lk/sin_apz/$key_id_result;
        }

        # --- LEGACY REWRITE RULES ---
        # These rules are likely obsolete because the map logic above handles mapped IDs.
        # They are kept here as a fallback for any unmapped IDs or other legacy behavior.
        # TODO: These can be safely removed once all redirection is confirmed to be handled by the map.
        rewrite ^/([0-9]+)/?$ /main?n=$1 permanent;
        rewrite ^/([0-9]+)/([0-9]+)/?$ /main?n=$1&p=$2 permanent;
        rewrite ^/([0-9]+)/([0-9]+)/([a-z,]+)/?$ /main?n=$1&p=$2&coll=$3 permanent;
        rewrite ^/([0-9]+)/([a-z,]+)/?$ /main?n=$1&coll=$2 permanent;
        # ----------------------------

        rewrite ^/$ /main permanent;
        # rewrite ^/books/?$ https://tipitaka.lk/library/0 permanent;
        # rewrite ^/books/all.html$ https://tipitaka.lk/library/0/all permanent;
        rewrite ^/map/?$ /tools/map.html permanent;

        root /home/janaka/www/pitaka.lk;
    }

    # other files that need to be downloaded
    # point them to the tipitaka.lk server 
    location /cloud {
        return 301 https://tipitaka.lk$request_uri;
    }
    location /library {
        return 301 https://tipitaka.lk$request_uri;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pitaka.lk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pitaka.lk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = pitaka.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name pitaka.lk *.pitaka.lk;
    listen 80;
    return 404; # managed by Certbot
}

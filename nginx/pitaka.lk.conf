# pitaka.lk on the tipitaka.lk droplet (/etc/nginx/conf.d/pitaka.lk.conf):
# - /main/: the reader, pitaka_lk.service on port 8403 (the pitaka flavor of pathnirvana/tipitaka.lk,
#   deployed by its scripts/deploy.sh --flavor pitaka)
# - everything else: the static sites in /home/janaka/www/pitaka.lk (this repo, dev/deploy.sh)
# - old Sarala Tipitaka links (/main?n=15100, /15100[/...]) go 301 to /main/<key> through nodeid_mapping.map,
#   unmapped ids to /main/

# the node-id map (~5900 short keys) fits nginx's default map hash sizes. They can't be set here anyway: the first map
# block nginx reads (arutha.lk.conf's) fixes them, and map_hash_max_size after it is a duplicate
map $pitaka_node_id $pitaka_key {
    default "";
    include /etc/nginx/conf.d/nodeid_mapping.map;
}

server {
    server_name pitaka.lk *.pitaka.lk;
    root /home/janaka/www/pitaka.lk;
    index index.html index.htm;
    # gzip (on in nginx.conf) covers only text/html by default; the unicode tools load scripts, styles and hb.wasm
    gzip_types application/javascript text/javascript text/css application/wasm image/svg+xml text/xml application/xml application/json font/ttf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        return 301 /main/;
    }

    # the reader
    location = /main {
        set $pitaka_node_id $arg_n;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        return 301 /main/;
    }
    location ^~ /main/ { # ^~ so that the static file locations below do not take the reader's scripts and images
        set $pitaka_node_id $arg_n;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        proxy_pass http://127.0.0.1:8403;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # old node-id links: /<id>, /<id>/<para>, /<id>/<colls>...
    location ~ "^/(?<pitaka_id>[0-9]+)(/|$)" {
        set $pitaka_node_id $pitaka_id;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        return 301 /main/;
    }

    location ~ ^/map/?$ {
        return 301 /tools/map.html;
    }

    # Sinhala Unicode tools: the old page names, and the old UN- fonts (replaced by the "<Name> Uni" fonts)
    location ~ ^/tools/unicode/(index\.html)?$ {
        return 301 /tools/unicode/fm-to-unicode/;
    }
    location = /tools/unicode/fm_to_unicode.htm {
        return 301 /tools/unicode/fm-to-unicode/;
    }
    location ~ ^/tools/unicode/(pali_bandi\.htm|pali_lengthening\.html)$ {
        return 301 /tools/unicode/pali-bandi/;
    }
    location ~ ^/tools/unicode/(download_unicode\.htm|fonts/(UN-[^/]*|FMABHAYA)\.(ttf|TTF))$ {
        return 301 /tools/unicode/sinhala-unicode-fonts/;
    }

    # files that live on tipitaka.lk
    location ^~ /cloud {
        return 301 https://tipitaka.lk$request_uri;
    }
    location ^~ /library {
        return 301 https://tipitaka.lk$request_uri;
    }

    # books and dhammapada: pages that moved
    location ^~ /books/obsolete/ {
        return 301 /books/;
    }
    location = /books/palibhashavatharanaya-1/11-4.html {
        return 301 /books/palibhashavatharanaya-1/13-1.html;
    }
    location ~ ^/dhammapada/ss/(index\.html)?$ {
        return 301 /dhammapada/;
    }

    # static files: media and fonts are cached for a month, pages, styles and scripts are revalidated with the etag
    # on every load since their names do not change between versions ('expires' keeps the server's add_header for hsts)
    location ~* \.(?:jpe?g|png|webp|gif|ico|mp3|m4a|pdf)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(?:woff2?|ttf)$ {
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; }
        expires 30d;
        try_files $uri =404;
    }
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pitaka.lk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pitaka.lk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pitaka.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name pitaka.lk *.pitaka.lk;
    listen 80;
    return 404; # managed by Certbot
}

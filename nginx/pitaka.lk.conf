# pitaka.lk on the tipitaka.lk droplet (/etc/nginx/conf.d/pitaka.lk.conf):
# - /main/: the reader, pitaka_lk.service on port 8403 (the pitaka flavor of pathnirvana/tipitaka.lk,
#   deployed by its scripts/deploy.sh --flavor pitaka)
# - everything else: the static sites in /home/janaka/www/pitaka.lk (this repo, dev/deploy.sh)
# - old Sarala Tipitaka links (/main?n=15100, /15100[/...]) go 301 to /main/<key> through nodeid_mapping.map,
#   unmapped ids to /main/

# the node-id map (~5900 short keys) fits nginx's default map hash sizes. They can't be set here anyway: the first map
# block nginx reads (arutha.lk.conf's) fixes them, and map_hash_max_size after it is a duplicate
map $pitaka_node_id $pitaka_key {
    default "";
    include /etc/nginx/conf.d/nodeid_mapping.map;
}

server {
    server_name pitaka.lk *.pitaka.lk;
    root /home/janaka/www/pitaka.lk;
    index index.html index.htm;

    location = / {
        return 301 /main/;
    }

    # the reader
    location = /main {
        set $pitaka_node_id $arg_n;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        return 301 /main/;
    }
    location /main/ {
        set $pitaka_node_id $arg_n;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        proxy_pass http://127.0.0.1:8403;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # old node-id links: /<id>, /<id>/<para>, /<id>/<colls>...
    location ~ "^/(?<pitaka_id>[0-9]+)(/|$)" {
        set $pitaka_node_id $pitaka_id;
        if ($pitaka_key) { return 301 /main/$pitaka_key; }
        return 301 /main/;
    }

    location ~ ^/map/?$ {
        return 301 /tools/map.html;
    }

    # files that live on tipitaka.lk
    location /cloud {
        return 301 https://tipitaka.lk$request_uri;
    }
    location /library {
        return 301 https://tipitaka.lk$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pitaka.lk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pitaka.lk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pitaka.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name pitaka.lk *.pitaka.lk;
    listen 80;
    return 404; # managed by Certbot
}

<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinhala Unicode Fonts - Abhaya, Malithi, Bindumathi | පිටක.lk</title>
    <meta name="description" content="Sinhala Unicode fonts from the FM and Isi designs of Pushpananda Ekanayake: Abhaya, Malithi, Bindumathi, Imanee, Ganganee, Samantha, Gurulugomi, Arundathee, Alakamanda and Davasa. සිංහල යුනිකේත අකුරු.">
    <link rel="canonical" href="https://pitaka.lk/tools/unicode/sinhala-unicode-fonts/">
    <link rel="icon" type="image/png" sizes="96x96" href="../../../static/images/favicon-96x96.png">
    <link rel="stylesheet" href="../lib/site.css">
    <style>
        .tester-preview { min-height: 3em; white-space: pre-wrap; word-wrap: break-word; padding: 12px; border: 1px solid var(--line);
            border-radius: 8px; background: #fff; color: #000; margin: 12px 0; }
        #text { min-height: 4.5em; }
        .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
        .controls label { display: flex; flex-direction: column; gap: 2px; }
        .controls input[type=range] { width: 100%; }
        .cards { display: grid; gap: 16px; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
        .card .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
        .card .name { font-size: 3.2rem; line-height: 1.3; color: var(--accent); }
        .card .files { display: flex; flex-wrap: wrap; gap: 6px; }
        .card .files a { font-size: .9rem; padding: 3px 10px; }
        .card .s1 { font-size: 2.2rem; line-height: 1.5; }
        .card .s2 { font-size: 1.4rem; line-height: 1.7; }
        .card [data-font] { transition: opacity .3s; }
        .card:not(.loaded) [data-font] { opacity: .25; }
    </style>
</head>
<body data-page="fonts">
<main>
    <h1 data-t="fontsTitle"></h1>
    <p class="lead" data-t="fontsLead"></p>
    <p class="hint" data-t="credit"></p>
    <p class="row">
        <a class="button" id="zip" href="#" download><span data-t="downloadAll"></span></a>
        <span class="hint" data-t="installNote"></span>
    </p>

    <section class="panel">
        <h2 style="margin-top: 0" data-t="tester"></h2>
        <textarea id="text" rows="3" data-t-placeholder="testerPlaceholder">ශ්‍රී ලංකා · සම‍්මා සම‍්බුද‍්ධස‍්ස · ආර්‍ය්‍ය වජ්‍රාසන</textarea>
        <div class="controls" style="margin-top: 12px">
            <label><span data-t="font"></span><select id="t-font"></select></label>
            <label><span><span data-t="size"></span> <output id="o-size"></output></span><input type="range" id="t-size" min="14" max="160" value="56"></label>
            <label class="var"><span><span data-t="weight"></span> <output id="o-weight"></output></span><input type="range" id="t-weight" min="400" max="700" value="400"></label>
            <label class="var"><span><span data-t="width"></span> <output id="o-width"></output></span><input type="range" id="t-width" min="75" max="100" value="100"></label>
            <label><span><span data-t="lineHeight"></span> <output id="o-lh"></output></span><input type="range" id="t-lh" min="1" max="2.5" step="0.05" value="1.5"></label>
            <label><span data-t="colour"></span><input type="color" id="t-colour" value="#000000"></label>
            <label><span data-t="align"></span><select id="t-align"><option value="left">←</option><option value="center">↔</option><option value="right">→</option></select></label>
        </div>
        <div id="preview" class="tester-preview" lang="si"></div>
        <div class="row">
            <button type="button" id="copy-png" data-t="copyImage"></button>
            <button type="button" class="quiet" id="png" data-t="downloadPng"></button>
            <button type="button" class="quiet" id="svg" data-t="downloadSvg"></button>
        </div>
        <p class="hint" data-t="imageNote"></p>
    </section>

    <div id="cards" class="cards"></div>
</main>
<script type="module" src="./fonts-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pali Script Converter – Sinhala, Roman, Thai | pitaka.lk</title>
<meta name="description" content="Pali transliteration among the Sinhala, Thai and IAST Roman scripts. තායි සහ රෝමන් අකුරු වලින් ඇති පාළි ලිපි සිංහලෙන් කියවන්න.">
<link rel="canonical" href="https://pitaka.lk/tools/converter.html">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="96x96" href="../static/images/favicon-96x96.png">
<style>
  @font-face { font-family: 'Abhaya Uni'; src: url('unicode/fonts/web/AbhayaUni-Regular.woff2') format('woff2'); font-display: swap; }
  :root { --bg: #fdfbf7; --surface: #f6f0e6; --text: #29231c; --muted: #6b6155; --border: #e4d9c7; --accent: #c2621f; --heading: #6e2b12; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161412; --surface: #211e1a; --text: #e8e1d5; --muted: #a69c8d; --border: #39332b; --accent: #e0954a; --heading: #f0c08a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; color: var(--heading); margin: 8px 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); }
  fieldset { border: none; padding: 0; margin: 12px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
  label.choice { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; }
  label.choice:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  textarea { display: block; width: 100%; min-height: 9rem; padding: 10px 12px; font: 1.1rem/1.6 'Abhaya Uni', 'Noto Serif Sinhala', 'Noto Serif Thai', serif;
    color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .note { color: var(--muted); font-size: .9rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
<h1>Pali Script Converter</h1>
<p class="lead">Pali text in the Sinhala, Roman (IAST) and Thai scripts, converted as you type. තායි සහ රෝමන් අකුරු වලින් ඇති පාළි සිංහලෙන් කියවන්න.
For 18 scripts, see the <a href="https://tipitaka.app/misc/convert">converter of tipitaka.app</a>.</p>

<fieldset>
  <legend>From</legend>
  <label class="choice"><input type="radio" name="from" value="si" checked> Sinhala සිංහල</label>
  <label class="choice"><input type="radio" name="from" value="ro"> Roman</label>
  <label class="choice"><input type="radio" name="from" value="th"> Thai ไทย</label>
</fieldset>
<textarea id="input" lang="si" aria-label="Text to convert" placeholder="Type or paste the Pali text here"></textarea>

<fieldset>
  <legend>To</legend>
  <label class="choice"><input type="radio" name="to" value="si"> Sinhala සිංහල</label>
  <label class="choice"><input type="radio" name="to" value="ro" checked> Roman</label>
  <label class="choice"><input type="radio" name="to" value="th"> Thai ไทย</label>
</fieldset>
<textarea id="output" lang="pi-Latn" aria-label="Converted text" readonly placeholder="The converted text"></textarea>
<div class="tools">
  <button type="button" id="copy">Copy</button>
  <button type="button" id="swap">⇅ Swap</button>
  <button type="button" id="test">Test pattern</button>
</div>

<p class="note">Report any conversion errors to pathnirvana@gmail.com · <a href="../books/">pitaka.lk</a></p>
</main>
<script src="converter.js"></script>
</body>
</html>
